name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (default: UTC date YYYY.MM.DD)'
        required: false
        type: string

permissions:
  contents: write   # needed to create GitHub releases

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      CMAKE_BUILD_TYPE: Release
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: "5G"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache llvm-project (upstream clone)
        uses: actions/cache@v4
        with:
          path: llvm-project
          key: llvm-project-llvmorg-18.1.0

      - name: Clone llvm-project (llvmorg-18.1.0)
        shell: pwsh
        run: |
          if (-not (Test-Path llvm-project/llvm/CMakeLists.txt)) {
            git clone --depth 1 --branch llvmorg-18.1.0 `
              https://github.com/llvm/llvm-project.git llvm-project
          } else {
            Write-Host 'llvm-project already present (cache hit).'
          }

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache sccache storage
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Populate llvm-project from V6CLANG mirrors
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/populate_llvm_project.ps1
          # robocopy exits 0-7 on success (with copies/extras); only >=8 is failure.
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC dev shell (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install reference tools (v6asm, v6emul)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          V6ASM_TAG: v2026.10.03
          V6EMUL_TAG: v1.0.2
        run: |
          # v6asm and v6emul are reference tools that V6CLANG installs separately and
          # does not bundle. The golden/benchmark suites and validate_dist.ps1
          # require V6EMUL (and V6ASM for the golden suite). Pin the release tags
          # so the workflow is reproducible.
          $tools = Join-Path $env:RUNNER_TEMP 'v6clang-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          gh release download $env:V6ASM_TAG  --repo parallelno/v6asm  --pattern '*windows-x86_64.zip' --dir $tools --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download v6asm release $env:V6ASM_TAG" }
          gh release download $env:V6EMUL_TAG --repo parallelno/v6emul --pattern '*windows-x86_64.zip' --dir $tools --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to download v6emul release $env:V6EMUL_TAG" }

          Get-ChildItem $tools -Filter '*.zip' | ForEach-Object {
            Expand-Archive $_.FullName -DestinationPath (Join-Path $tools $_.BaseName) -Force
          }

          $asm = (Get-ChildItem $tools -Recurse -Filter 'v6asm.exe'  | Select-Object -First 1).FullName
          $emu = (Get-ChildItem $tools -Recurse -Filter 'v6emul.exe' | Select-Object -First 1).FullName
          if (-not $asm) { throw 'v6asm.exe not found in the downloaded archive' }
          if (-not $emu) { throw 'v6emul.exe not found in the downloaded archive' }

          # Export for every subsequent step (release test gate + smoke test).
          "V6ASM=$asm"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "V6EMUL=$emu" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "V6ASM=$asm"
          Write-Host "V6EMUL=$emu"

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $manual = '${{ inputs.version }}'
          if ($manual) {
            $v = $manual
          } elseif ($tag -match '^v(.+)$') {
            $v = $Matches[1]
          } else {
            $v = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')
          }
          Write-Host "version=$v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: CMake configure
        shell: pwsh
        run: |
          cmake -G Ninja `
            -S llvm-project/llvm `
            -B llvm-build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DLLVM_TARGETS_TO_BUILD=X86 `
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=V6Clang `
            "-DLLVM_ENABLE_PROJECTS=clang;lld"

      - name: Build
        shell: pwsh
        run: |
          ninja -C llvm-build `
            clang lld llc opt `
            llvm-objcopy llvm-readelf llvm-objdump llvm-ar llvm-mc llvm-nm `
            llvm-dwarfdump `
            FileCheck not split-file

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Run tests (release gate)
        shell: pwsh
        run: python tests/run_all.py

      - name: Stage + package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/make_dist.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Smoke-test staged tree
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/validate_dist.ps1 -Stage "dist/v6clang-${{ steps.ver.outputs.version }}-windows-x64"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v6clang-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/v6clang-${{ steps.ver.outputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v6clang ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/v6clang-${{ steps.ver.outputs.version }}-windows-x64.zip
